# ================================================
# Campus Lost & Found Management System
# Application Configuration
# ================================================

spring.application.name=FindBack - Campus Lost & Found

# ================================================
# SERVER
# ================================================
server.port=${PORT:8080}

# ================================================
# DATABASE — PostgreSQL
# Use environment variables for production.
# Set defaults for local dev below.
# ================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres.railway.internal:5432/railway}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:qRjjgjkGzMluMfXNPtFdvnFvuysUfDUp}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ================================================
# JPA / HIBERNATE
# ================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Dhaka

# Open-in-view disabled (best practice for REST/Thymeleaf apps)
spring.jpa.open-in-view=false

# ================================================
# THYMELEAF
# ================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ================================================
# FILE UPLOAD (item images)
# ================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Directory where uploaded images are saved (relative to working dir)
app.upload.dir=uploads/items

# ================================================
# LOGGING
# ================================================
logging.level.com.lostfound=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
