<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Users — Admin — FindBack</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body class="lf-admin-body">

<div class="d-flex min-vh-100">

    <!-- ========== ADMIN SIDEBAR ========== -->
    <aside class="lf-admin-sidebar">
        <div class="lf-admin-sidebar-brand">
            <a th:href="@{/}" class="lf-brand text-decoration-none">
                <i class="bi bi-search-heart-fill"></i><span>FindBack</span>
            </a>
            <div class="lf-admin-sidebar-badge">Admin</div>
        </div>
        <nav class="lf-admin-nav">
            <div class="lf-admin-nav-section-label">Main</div>
            <a th:href="@{/admin}" class="lf-admin-nav-link">
                <i class="bi bi-speedometer2"></i><span>Dashboard</span>
            </a>
            <a th:href="@{/admin/users}" class="lf-admin-nav-link active">
                <i class="bi bi-people"></i><span>Users</span>
            </a>
            <a th:href="@{/admin/items}" class="lf-admin-nav-link">
                <i class="bi bi-box-seam"></i><span>Items</span>
            </a>
            <div class="lf-admin-nav-section-label mt-3">User Area</div>
            <a th:href="@{/dashboard}" class="lf-admin-nav-link">
                <i class="bi bi-grid"></i><span>My Dashboard</span>
            </a>
            <a th:href="@{/browse}" class="lf-admin-nav-link">
                <i class="bi bi-search"></i><span>Browse Items</span>
            </a>
        </nav>
        <div class="lf-admin-sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="lf-admin-nav-link w-100 border-0 bg-transparent text-start">
                    <i class="bi bi-box-arrow-right"></i><span>Sign Out</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="lf-admin-main flex-grow-1">

        <!-- Top Bar -->
        <header class="lf-admin-topbar">
            <div class="d-flex align-items-center gap-2">
                <h4 class="mb-0 fw-semibold"><i class="bi bi-people me-2"></i>Manage Users</h4>
                <span class="badge bg-secondary ms-1" th:if="${users != null}" th:text="${#lists.size(users)}">0</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span class="text-muted small">
                    <i class="bi bi-person-circle me-1"></i>
                    <sec:authentication property="name"/>
                </span>
            </div>
        </header>

        <!-- Content -->
        <div class="lf-admin-content p-4">

            <!-- Flash Messages -->
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                <span th:text="${successMsg}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible d-flex align-items-center gap-2 mb-4" role="alert">
                <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
                <span th:text="${errorMsg}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Search / Filter Bar -->
            <div class="lf-admin-card mb-4">
                <div class="lf-admin-card-body p-3">
                    <form th:action="@{/admin/users}" method="get" class="row g-2 align-items-end">
                        <div class="col-md-6">
                            <label for="search" class="form-label lf-form-label mb-1 small">Search</label>
                            <div class="input-group">
                                <span class="input-group-text lf-input-icon"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control lf-form-control" id="search"
                                       name="search" th:value="${param.search}" placeholder="Search by name or email..."/>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label for="role" class="form-label lf-form-label mb-1 small">Role</label>
                            <select class="form-select lf-form-control" id="role" name="role">
                                <option value="">All Roles</option>
                                <option value="USER" th:selected="${param.role == 'USER'}">User</option>
                                <option value="ADMIN" th:selected="${param.role == 'ADMIN'}">Admin</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn lf-btn-primary w-100">
                                <i class="bi bi-funnel me-1"></i>Filter
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Users Table -->
            <div class="lf-admin-card">
                <div class="lf-admin-card-header">
                    <h5 class="mb-0"><i class="bi bi-table me-2"></i>All Users</h5>
                </div>
                <div class="lf-admin-card-body p-0">
                    <div th:if="${users != null and !#lists.isEmpty(users)}" class="table-responsive">
                        <table class="table lf-admin-table mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Role</th>
                                    <th>Reports</th>
                                    <th>Joined</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user, stat : ${users}">
                                    <td class="text-muted small" th:text="${user.id}">1</td>
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="lf-admin-avatar">
                                                <span th:text="${user.name != null ? user.name.substring(0,1).toUpperCase() : '?'}">U</span>
                                            </div>
                                            <span class="fw-semibold" th:text="${user.name}">Name</span>
                                        </div>
                                    </td>
                                    <td th:text="${user.email}">email@example.com</td>
                                    <td th:text="${user.phone != null ? user.phone : '—'}">Phone</td>
                                    <td>
                                        <span th:if="${user.role != null and user.role.name() == 'ADMIN'}"
                                              class="badge bg-danger">ADMIN</span>
                                        <span th:if="${user.role == null or user.role.name() == 'USER'}"
                                              class="badge bg-primary">USER</span>
                                    </td>
                                    <td>
                                        <span class="badge bg-secondary" th:text="${user.items != null ? #lists.size(user.items) : 0}">0</span>
                                    </td>
                                    <td>
                                        <span th:text="${user.createdAt != null ? user.createdAt != null ? user.createdAt.toString() : "" : '—'}">Date</span>
                                    </td>
                                    <td>
                                        <div class="d-flex gap-1">
                                            <!-- Toggle Role -->
                                            <form th:action="@{/admin/users/{id}/toggle-role(id=${user.id})}" method="post" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-xs lf-btn-edit" title="Toggle Role"
                                                        onclick="return confirm('Toggle this user\'s role?')">
                                                    <i class="bi bi-arrow-repeat"></i>
                                                </button>
                                            </form>
                                            <!-- Delete -->
                                            <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" class="d-inline">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-xs lf-btn-delete" title="Delete User"
                                                        onclick="return confirm('Permanently delete this user and all their data?')">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Empty State -->
                    <div th:if="${users == null or #lists.isEmpty(users)}" class="lf-empty-state py-5">
                        <i class="bi bi-people lf-empty-icon"></i>
                        <h6 class="mt-3 mb-1">No users found</h6>
                        <p class="text-muted small mb-0">No users match your search criteria.</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
